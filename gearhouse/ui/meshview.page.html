<title>3D 차 모델 시험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
  /* layout: the car on a strip of track surface, the controls beside it like a test bench's dials (stacked under it on a phone) */
  :root { --bg: #e9e6df; --panel: #f6f4ef; --ink: #23211d; --soft: #6b665c; --line: #cfc9bc; --accent: #a0522d; --ground: #c9c2b2;
    --display: 'Oswald', 'Arial Narrow', sans-serif; --body: 'Noto Sans KR', system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1a18; --panel: #24231f; --ink: #ebe7de; --soft: #a39d90; --line: #3a3832; --accent: #d78a5c; --ground: #3a372f; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1b1a18; --panel: #24231f; --ink: #ebe7de; --soft: #a39d90; --line: #3a3832; --accent: #d78a5c; --ground: #3a372f; color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-family: var(--display); font-weight: 500; letter-spacing: 0.04em; font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .lede { color: var(--soft); margin: 0 0 16px; max-width: 65ch; line-height: 1.5; }
  .bench { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage { min-width: 0; flex: 1 1 520px; display: grid; gap: 8px; }
  .track { background: var(--ground); border: 1px solid var(--line); border-radius: 6px; overflow: auto; display: grid; place-items: center; padding: 12px; max-width: 100%; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; touch-action: none; max-width: none; }
  canvas:active { cursor: grabbing; }
  #stat { color: var(--soft); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .dials { flex: 1 1 260px; max-width: 360px; display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  label, legend { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--soft); text-transform: uppercase; }
  .row { display: grid; gap: 6px; }
  .val { font-variant-numeric: tabular-nums; color: var(--ink); text-transform: none; letter-spacing: 0; float: right; }
  select, input[type=range] { width: 100%; accent-color: var(--accent); }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 0.85rem; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; }
  .seg label:has(input:checked) { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 0.85rem; }
  .note { font-size: 0.8rem; color: var(--soft); line-height: 1.5; margin: 0; }
</style>
<h1>3D 차 모델 시험</h1>
<p class="lede">1935 그랜드 로드스터를 단면 로프트 방식의 로우폴리 3D로 만든 시제품입니다. 그림을 끌면 좌우로 돌고, 위아래로 끌면 내려다보는 각도가 바뀝니다.</p>
<div class="bench">
  <div class="stage">
    <div class="track"><canvas id="view" width="400" height="260" aria-label="차 미리보기: 끌어서 돌리기"></canvas></div>
    <div id="stat">그리는 중…</div>
  </div>
  <form class="dials" onsubmit="return false">
    <div class="row"><label for="yaw">방향</label><input type="range" id="yaw" min="0" max="359" value="30"></div>
    <label class="check"><input type="checkbox" id="spin"> 자동으로 돌리기</label>
    <label class="check"><input type="checkbox" id="roll"> 바퀴 굴리기</label>
    <div class="row"><label for="pitch">내려다보는 각도 <span class="val" id="pitchv">40°</span></label><input type="range" id="pitch" min="0" max="90" value="40"></div>
    <div class="row"><label for="res">그리는 해상도 <span class="val" id="resv">1배</span></label><input type="range" id="res" min="0.5" max="3" step="0.25" value="1"></div>
    <div class="row"><label for="line">테두리 두께</label><select id="line"><option value="0">없음</option><option value="1">1픽셀</option><option value="2" selected>2픽셀</option><option value="3">3픽셀</option><option value="4">4픽셀</option></select></div>
    <div class="row"><label for="px">화면 픽셀 크기 <span class="val" id="pxv">2배</span></label><input type="range" id="px" min="1" max="4" step="1" value="2"></div>
    <p class="note">해상도 1배가 트랙 게임 크기(16.7 mm/픽셀)입니다. 0.5배로 내리면 픽셀이 굵어지고, 각도를 0°로 내리면 옆모습(집 앞 장면용)이 됩니다.</p>
  </form>
</div>
<script>/*BUNDLE*/</script>
