<title>Gearhouse Test Build</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* single dark look: a walnut desk around a pixel screen; the game draws everything else itself */
  :root { --bg: #140e0b; --frame: #7a5a22; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
  .wrap { position: relative; line-height: 0; box-shadow: 0 0 0 2px var(--frame), 0 8px 40px #000; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; touch-action: none; display: block; max-width: 100%; }
  #scan { position: absolute; left: 0; top: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.13) 3px); }
</style>
<div class="wrap"><canvas id="screen" width="480" height="270" aria-label="Gearhouse game screen"></canvas><div id="scan"></div></div>
<script type="module" src="./game/main.mjs"></script>
