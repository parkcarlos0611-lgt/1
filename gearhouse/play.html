<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gearhouse Test Build</title>
<style>
  :root { --bg: #140e0b; --frame: #7a5a22; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #140e0b; --frame: #7a5a22; } }
  :root[data-theme="dark"] { --bg: #140e0b; --frame: #7a5a22; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; }
  .wrap { position: relative; line-height: 0; box-shadow: 0 0 0 2px var(--frame), 0 8px 40px #000; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; touch-action: none; display: block; }
  #scan { position: absolute; left: 0; top: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.13) 3px); }
</style>
</head>
<body>
<div class="wrap"><canvas id="screen" width="480" height="270"></canvas><div id="scan"></div></div>
<script type="module" src="./game/main.mjs"></script>
</body>
</html>
