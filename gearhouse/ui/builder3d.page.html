<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부품 빌더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
  /* the parts builder (docs/systems/98, B3): the car on a turntable fills the window; the choices on the left in tabs,
     the figures on the right; on a phone the choices come up from the bottom as a drawer and the figures sit in a strip */
  :root { --bg: #e9e6df; --panel: rgba(246,244,239,0.94); --solid: #f6f4ef; --ink: #23211d; --soft: #6b665c; --line: #cfc9bc; --accent: #a0522d; --warn: #b3361f; --good: #3f7a3a;
    --display: 'Oswald', 'Arial Narrow', sans-serif; --body: 'Noto Sans KR', system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1a18; --panel: rgba(36,35,31,0.92); --solid: #24231f; --ink: #ebe7de; --soft: #a39d90; --line: #3a3832; --accent: #d78a5c; --warn: #ff8a6e; --good: #9fd08f; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1b1a18; --panel: rgba(36,35,31,0.92); --solid: #24231f; --ink: #ebe7de; --soft: #a39d90; --line: #3a3832; --accent: #d78a5c; --warn: #ff8a6e; --good: #9fd08f; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #141311; color: var(--ink); font-family: var(--body); overflow: hidden; font-size: 14px; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .nogl { position: fixed; inset: 40% 0 auto; text-align: center; color: #ddd; }
  button, select, input, textarea { font: inherit; color: inherit; }
  .btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--solid); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.main { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
  .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* the top bar */
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; z-index: 5; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .top h1 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; letter-spacing: 0.05em; margin: 0; color: #f4f1ea; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  .top .name { flex: 0 1 220px; min-width: 80px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--solid); }
  .top .grow { flex: 1; }
  .top .saved { font-size: 0.75rem; color: #e8e2d4; text-shadow: 0 1px 2px #000; }
  /* the choices */
  .side { position: fixed; top: 52px; left: 12px; bottom: 12px; width: 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; z-index: 4; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
  .tabs button { font-size: 0.82rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--solid); cursor: pointer; }
  .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .panes { flex: 1; overflow-y: auto; padding: 12px; }
  .pane { display: none; gap: 12px; } .pane.on { display: grid; }
  .row { display: grid; gap: 5px; }
  .row > label, .lab { font-size: 0.74rem; letter-spacing: 0.05em; color: var(--soft); display: flex; justify-content: space-between; gap: 8px; }
  .row > label .v { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--solid); width: 100%; }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  .seg button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--solid); cursor: pointer; font-size: 0.85rem; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
  .swatches input[type=color] { width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 0; background: none; }
  .note { font-size: 0.78rem; color: var(--soft); line-height: 1.5; margin: 0; }
  h2 { font-size: 0.8rem; font-weight: 600; margin: 6px 0 0; }
  .list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; background: var(--solid); }
  .list li.me { border-color: var(--accent); }
  .list li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
  .list li small { color: var(--soft); font-size: 0.72rem; }
  .list .btn { padding: 4px 8px; font-size: 0.78rem; }
  textarea { width: 100%; box-sizing: border-box; min-height: 90px; font-family: ui-monospace, monospace; font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; background: var(--solid); padding: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  /* the figures */
  .figs { position: fixed; top: 52px; right: 12px; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; z-index: 4; box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-height: calc(100% - 64px); overflow-y: auto; box-sizing: border-box; }
  .figs h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 500; letter-spacing: 0.05em; font-size: 0.95rem; }
  .figs dl { display: grid; grid-template-columns: auto auto; gap: 4px 10px; margin: 0; font-variant-numeric: tabular-nums; }
  .figs dt { color: var(--soft); font-size: 0.8rem; } .figs dd { margin: 0; text-align: right; font-weight: 600; }
  .figs dd small { font-weight: 400; color: var(--soft); font-size: 0.72rem; }
  .figs dd.up { color: var(--good); } .figs dd.down { color: var(--warn); }
  .figs .warn { margin-top: 8px; padding: 6px 8px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); font-size: 0.78rem; line-height: 1.45; }
  .figs .warn[hidden] { display: none; }
  .figs .meas { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  /* the view's own controls, bottom middle */
  .viewbar { position: fixed; bottom: 12px; left: 354px; right: 254px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; z-index: 3; pointer-events: none; }
  .viewbar > * { pointer-events: auto; }
  .viewbar .btn, .viewbar select { background: rgba(20,18,15,0.6); color: #f4f1ea; border-color: rgba(255,255,255,0.35); width: auto; }
  .viewbar .btn[aria-pressed="true"] { border-color: var(--accent); color: #ffcf9e; }
  .hint { position: fixed; bottom: 54px; left: 354px; right: 254px; text-align: center; font-size: 0.74rem; color: #d8d2c4; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 2; }
  .toggle { display: none; }
  /* a phone: the choices a drawer from the bottom, the figures a strip under the bar */
  @media (max-width: 760px) {
    .top { padding: 6px 8px; gap: 6px; } .top h1 { font-size: 1rem; } .top .saved { display: none; }
    .top .name { flex: 1 1 auto; }
    .figs { top: 48px; left: 8px; right: 8px; width: auto; padding: 6px 8px; max-height: none; }
    .figs h2 { display: none; }
    .figs dl { grid-template-columns: repeat(4, auto auto); gap: 2px 6px; font-size: 0.78rem; } .figs dt { font-size: 0.68rem; }
    .figs .meas { margin-top: 4px; padding-top: 4px; font-size: 0.72rem; } .figs .warn { margin-top: 4px; padding: 3px 6px; font-size: 0.72rem; }
    .side { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: min(62vh, 520px); border-radius: 12px 12px 0 0; transform: translateY(100%); transition: transform 0.2s ease; }
    body.open .side { transform: none; }
    .toggle { display: inline-flex; position: fixed; left: 8px; bottom: 10px; z-index: 6; }
    body.open .toggle { bottom: calc(min(62vh, 520px) + 8px); }
    .viewbar { left: 8px; right: 8px; bottom: 54px; justify-content: flex-end; } body.open .viewbar { display: none; }
    .hint { display: none; }
  }
  @media (max-width: 760px) and (max-height: 500px) { .side { height: 78vh; } body.open .toggle { bottom: calc(78vh + 8px); } }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>
<canvas id="view" aria-label="3D 미리보기 (끌어서 돌리기, 휠·두 손가락으로 확대)"></canvas>
<div class="top">
  <h1>부품 빌더</h1>
  <input id="name" class="name" type="text" maxlength="40" aria-label="설계 이름">
  <button type="button" id="save" class="btn">저장</button>
  <span id="saved" class="saved" aria-live="polite"></span>
  <span class="grow"></span>
  <a id="drive" class="btn main" href="drive.html" target="_blank" rel="opener">시험 주행 ▶</a>
</div>
<aside class="side" id="side" aria-label="설계">
  <div class="tabs" role="tablist" id="tabs"></div>
  <form class="panes" id="panes" onsubmit="return false"></form>
</aside>
<button type="button" id="toggle" class="btn toggle" aria-expanded="false" aria-controls="side">⚙ 설계</button>
<section class="figs" aria-label="수치">
  <h2>수치 (계산)</h2>
  <dl id="figs"></dl>
  <div id="warn" class="warn" role="status" hidden></div>
  <div id="meas" class="meas"></div>
</section>
<div class="viewbar">
  <button type="button" class="btn" id="spin" aria-pressed="false">턴테이블</button>
  <button type="button" class="btn" id="lamps" aria-pressed="false">팝업 램프</button>
  <button type="button" class="btn" id="engine" aria-pressed="false">엔진 보기</button>
  <select id="look" aria-label="조명·재질"><option value="2" selected>PBR</option><option value="3">툰</option><option value="0">단계 조명</option></select>
  <button type="button" class="btn" id="home">시점 초기화</button>
</div>
<div class="hint">끌어서 돌리기 · 휠/두 손가락으로 확대 · 두 번 눌러 시점 초기화</div>
<script>/*BUNDLE*/</script>
