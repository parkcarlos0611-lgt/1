<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fighter Lab 2D</title>
<style>
:root{--bg:#07080b;--panel:rgba(14,16,22,.86);--ln:#2a2e38;--tx:#eef0f4;--mu:#8b92a1;--red:#d4141b;--gold:#f2b544}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px 'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.pn{position:fixed;right:max(12px,env(safe-area-inset-right));top:12px;width:260px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--ln);border-radius:12px;padding:12px}
.pn h1{font:700 16px Oswald,'Noto Sans KR',sans-serif;letter-spacing:.06em;margin:0 0 2px}.pn p{margin:4px 0;color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
button{background:#1b1e26;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:8px 4px;font:600 12.5px 'Noto Sans KR',sans-serif;cursor:pointer}button:active{transform:scale(.96)}
button.on{background:var(--red);border-color:var(--red)}button.wide{grid-column:span 3}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}input[type=range]{width:100%;accent-color:var(--red)}
.st{font:12px ui-monospace,Menlo,monospace;color:#9fe;white-space:pre-line;margin-top:8px}
#stick{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);touch-action:none}#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid #141418}
.hint{position:fixed;left:170px;bottom:12px;color:var(--mu);font-size:12px;background:var(--panel);padding:6px 10px;border-radius:8px;border:1px solid var(--ln)}
@media (max-width:700px){.pn{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46vh}.hint{display:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div class="pn">
  <h1>FIGHTER LAB 2D</h1><p>플랫 벡터 2D · 경기장 전체 이동 · 앞/뒤/양옆 표현</p>
  <label>빨강 선수 공격</label>
  <div class="g">
    <button data-s="jab">잽</button><button data-s="cross">스트레이트</button><button data-s="hookL">리드 훅</button>
    <button data-s="hookR">리어 훅</button><button data-s="upper">어퍼컷</button><button data-s="bodyHook">바디 훅</button>
    <button data-s="lowKick">로킥</button><button data-s="midKick">미들킥</button><button data-s="highKick">하이킥</button>
  </div>
  <label>파랑 선수</label>
  <div class="g"><button id="guard" class="on">가드 올림</button><button id="ko">KO (힘 풀기)</button><button id="reset">리셋</button></div>
  <label>화면</label>
  <div class="g"><button id="circ">파랑 이동(서클링)</button><button id="auto">빨강 자동 공격</button><button id="slow">슬로모션</button><button id="dbg" class="wide">관절 보기</button></div>
  <label>빨강 이동: WASD / 방향키 · 화면 왼쪽 아래 스틱</label>
  <label>클릭 타격 세기</label><input id="pow" type="range" min="2" max="40" value="14">
  <div class="st" id="st"></div>
</div>
<div class="hint">파랑 선수를 클릭/탭하면 그 지점을 때립니다</div><div id="stick"><div id="knob"></div></div>
<script src="rig.js"></script><script src="physics.js"></script><script src="render.js"></script><script src="render2d.js"></script>
<script>
(function(){const V=E2.V,cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0}addEventListener('resize',resize);resize();
const st=new E2.Stage();let circ=false;let A,B,slow=false,debug=false,auto=false,autoT=0;
function make(){const d=.45;
  A=new E2.Body({cx:-d,yaw:0,side:0,name:'RED',corner:'#c41010',look:{skin:[200,146,108],shorts:[150,22,26],band:[235,235,235]}});
  B=new E2.Body({cx:d,yaw:Math.PI,side:1,name:'BLUE',corner:'#1f5fd6',look:{skin:[176,120,88],shorts:[28,52,120],band:[230,230,230]},lowGuard:!document.getElementById('guard').classList.contains('on')});
  A.opp=B;B.opp=A;for(let i=0;i<30;i++){A.step(1/60);B.step(1/60)}}
make();
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>A.play(b.dataset.s));
const tg=(id,fn)=>{const e=document.getElementById(id);e.onclick=()=>{e.classList.toggle('on');fn(e.classList.contains('on'))}};
tg('guard',on=>{B.setGuard(on);document.getElementById('guard').textContent=on?'가드 올림':'가드 내림'});
document.getElementById('ko').onclick=()=>{B.setKO(!B.ko);document.getElementById('ko').classList.toggle('on',B.ko)};
document.getElementById('reset').onclick=()=>{make();document.getElementById('ko').classList.remove('on')};
tg('slow',on=>slow=on);tg('dbg',on=>debug=on);tg('auto',on=>auto=on);tg('circ',on=>circ=on);
/* movement input: keyboard + touch stick (screen-relative: right = +x, up = into the cage) */
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
const stick={x:0,y:0,id:null},sk=document.getElementById('stick'),kn=document.getElementById('knob');
sk.addEventListener('pointerdown',e=>{stick.id=e.pointerId;sk.setPointerCapture(e.pointerId);mvStick(e)});sk.addEventListener('pointermove',e=>{if(stick.id===e.pointerId)mvStick(e)});
const endS=()=>{stick.id=null;stick.x=stick.y=0;kn.style.transform=''};sk.addEventListener('pointerup',endS);sk.addEventListener('pointercancel',endS);
function mvStick(e){const r=sk.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}stick.x=dx;stick.y=dy;kn.style.transform=`translate(${dx*40}px,${dy*40}px)`}
/* click to hit */cv.addEventListener('pointerdown',e=>hitAt(e.clientX,e.clientY));
function hitAt(sx,sy){let best=null,bd=.2*st.s;for(let i=0;i<B.n;i++){const p=st.proj(V.n(B.x[i],B.y[i],B.z[i]));const d=Math.hypot(p.x-sx,p.y-sy)-p.z*.001;if(d<bd){bd=d;best=i}}
  if(best==null)return;const q=V.n(B.x[best],B.y[best],B.z[best]);B.poke(q,V.sc(st.view(),-1),+document.getElementById('pow').value)}
let circT=0,circDir=1;
/* loop */let last=performance.now(),acc=0,fps=60,quads=0;const strikes=['jab','cross','hookL','hookR','upper','bodyHook','lowKick','midKick','highKick'];
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;fps=fps*.95+(1/Math.max(.001,dt))*.05;acc+=dt*(slow?.25:1);
  while(acc>=1/60){acc-=1/60;{let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y;A.mv.x=mx;A.mv.z=mz;}
    if(circ&&!B.ko){circT-=1/60;if(circT<=0){circT=1+Math.random()*1.6;circDir=Math.random()<.5?-1:1}const dx=A.cx-B.cx,dz=A.cz-B.cz,d=Math.hypot(dx,dz)||1;const ux=dx/d,uz=dz/d;const keep=(d-.95)*1.4;B.mv.x=-uz*circDir*.8+ux*keep;B.mv.z=ux*circDir*.8+uz*keep}else B.mv.x=B.mv.z=0;
    A.step(1/60);B.step(1/60);if(auto&&!B.ko){autoT-=1/60;if(autoT<=0&&!A.clip){A.play(strikes[Math.random()*strikes.length|0]);autoT=.5+Math.random()*.8}}}
  ctx.setTransform(dpr,0,0,dpr,0,0);st.setup(W,H,[A,B]);E2.drawArena2d(ctx,st,W,H,'back');quads=E2.draw2d(ctx,st,[A,B],{debug});E2.drawArena2d(ctx,st,W,H,'front');
  /* recent impacts */for(const h of B.hits){const age=B.t-h.t;if(age>.35)continue;const p=st.proj(h.p);const s=st.s;ctx.strokeStyle=`rgba(255,240,200,${1-age/.35})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,(.03+age*.5)*s,0,7);ctx.stroke()}
  const c=E2.physCount(B);document.getElementById('st').textContent=`관절(물리 입자) ${c.joints} /선수\n살·근육 관성 노드 ${c.flesh} /선수\n피부 표면 노드 ${c.skin} /선수\n물리 노드 합계 ${c.total} /선수\n구속 조건 ${c.constraints}\n벡터 도형 ${quads}  ·  ${fps.toFixed(0)} fps`+(B.hits.length?`\n최근 충격량 ${B.hits[B.hits.length-1].J.toFixed(1)} N·s (${B.hits[B.hits.length-1].zone})`:'')}
requestAnimationFrame(frame);window.__lab={st,get A(){return A},get B(){return B}};})();
</script></body></html>
