<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEARHOUSE 책상</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { color-scheme: dark; --wood: #2a1c14; --wood2: #3a281c; --paper: #efe4cc; --paper2: #e2d4b6; --ink: #2b2118; --ink2: #6b5a48; --line: #c9b891; --brass: #c8a050; --need: #a8402c; --ok: #4f7a4a; --hold: #4a6a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--wood); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; -webkit-text-size-adjust: 100%; }
  #app { max-width: 880px; margin: 0 auto; padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood); }
  main, .start { color-scheme: light; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { min-height: 44px; padding: 8px 14px; border: 2px solid var(--ink); background: var(--paper2); border-radius: 3px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: translateY(1px); } button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--brass); font-weight: 700; }
  button.mini { min-height: 36px; padding: 4px 10px; font-size: 14px; border-width: 1px; }
  button.back { border: 0; background: none; padding-left: 0; color: var(--ink2); }
  input, select { min-height: 44px; padding: 6px 8px; border: 2px solid var(--ink2); background: #fffaf0; border-radius: 3px; min-width: 0; max-width: 100%; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 0 8px; background: var(--wood); color: var(--paper); }
  .when { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-width: 0; } .when b { font-size: 17px; } #clock { font-variant-numeric: tabular-nums; color: var(--brass); }
  .sky { padding: 0 8px; border: 1px solid currentColor; border-radius: 10px; font-size: 14px; } .sky.rain { color: #9dbbe0; } .sky.snow { color: #fff; } .sky.clear { color: #ecd28a; }
  .cash { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--brass); }
  .speed { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; } .speed button { flex: 1 1 auto; background: var(--wood2); color: var(--paper); border-color: #6b5134; } .speed button.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  #daybar { grid-column: 1 / -1; height: 4px; background: var(--wood2); } #daybar i { display: block; height: 100%; width: 0; background: var(--brass); }
  nav { display: flex; gap: 4px; margin: 8px 0 0; } nav button { flex: 1 1 0; min-width: 0; padding: 8px 4px; border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--paper2); opacity: .75; font-size: 15px; overflow-wrap: anywhere; } nav button.on { background: var(--paper); opacity: 1; font-weight: 700; }
  nav em { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 5px; border-radius: 10px; background: var(--need); color: #fff; font-style: normal; font-size: 13px; }
  main { background: var(--paper); border: 2px solid var(--ink); border-radius: 0 0 6px 6px; padding: 12px 14px 18px; min-height: 50vh; }
  h2 { margin: 16px 0 8px; font-size: 17px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; } h2:first-child { margin-top: 2px; } h2 small { font-weight: 400; color: var(--ink2); font-size: 14px; }
  .empty, .hint, .meta { color: var(--ink2); font-size: 14px; margin: 4px 0 8px; } p { margin: 6px 0; overflow-wrap: anywhere; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  .list li { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 10px 10px; min-height: 48px; border: 1px solid var(--line); border-left: 5px solid var(--line); background: #f7eeda; margin-bottom: 6px; cursor: pointer; }
  .list li.need { border-left-color: var(--need); } .list li.read { opacity: .7; } .list.plain li { cursor: default; }
  .list b { white-space: nowrap; } .list span { min-width: 0; overflow-wrap: anywhere; } .list time { grid-column: 1 / -1; font-size: 13px; color: var(--ink2); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; } .row button { flex: 1 1 auto; }
  label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 8px 0; } label input, label select { flex: 1 1 140px; }
  fieldset { border: 1px solid var(--line); margin: 12px 0 0; padding: 4px 12px 10px; min-width: 0; } legend { font-weight: 700; padding: 0 6px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; } dt { color: var(--ink2); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  blockquote.letter { margin: 8px 0; padding: 12px 14px; background: #fffaf0; border: 1px solid var(--line); font-family: Georgia, "Nanum Myeongjo", serif; white-space: pre-wrap; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; } th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; } th { font-size: 13px; color: var(--ink2); font-weight: 400; white-space: nowrap; } td:first-child { overflow-wrap: anywhere; }
  .tag { font-size: 13px; color: var(--ink2); } .note { margin: 8px 0; padding: 8px 10px; background: #f7eeda; border: 1px dashed var(--ink2); }
  .tasks li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); } .tasks li.off { opacity: .6; }
  .tasks li > div:first-child { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; min-width: 0; } .tasks span { color: var(--ink2); font-size: 14px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .tasks em { font-style: normal; font-size: 13px; padding: 0 6px; border-radius: 8px; color: #fff; background: var(--ink2); } .tasks em.hold { background: var(--hold); }
  .bar { grid-column: 1; height: 8px; background: var(--paper2); border: 1px solid var(--ink2); } .bar i { display: block; height: 100%; background: var(--ok); }
  .ord { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; } .ord button { min-width: 40px; min-height: 40px; }
  .paper { font-family: Georgia, "Nanum Myeongjo", "Batang", serif; } .paper.yellowed { background: #e9d9ae; } .paper.creased, .paper.brittle { background: #dcc790; }
  .mast { text-align: center; border-top: 3px double var(--ink); border-bottom: 3px double var(--ink); padding: 6px 0; margin: 4px 0 10px; } .mast b { display: block; font-size: 24px; letter-spacing: .02em; overflow-wrap: anywhere; } .mast span { font-size: 13px; color: var(--ink2); }
  h3.page { margin: 14px 0 4px; font-size: 13px; color: var(--ink2); border-bottom: 1px solid var(--ink2); font-weight: 400; }
  article { padding: 8px 0 6px; border-bottom: 1px solid var(--line); } article h4 { margin: 0 0 4px; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; } article.big h4 { font-size: 22px; } article.small h4 { font-size: 15px; }
  article p { font-size: 15px; } article footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); } article footer button { margin-left: auto; font-family: system-ui, sans-serif; }
  .ads li { padding: 8px 10px; margin: 6px 0; border: 2px solid var(--ink); text-align: center; } .ads li.mine { background: #fffaf0; font-weight: 700; }
  .journal li { padding: 5px 0; border-bottom: 1px dotted var(--line); font-size: 14px; overflow-wrap: anywhere; } .journal time { color: var(--ink2); margin-right: 8px; }
  .start { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; margin-top: 8vh; padding: 20px 18px; } .start h1 { margin: 0; letter-spacing: .08em; } .start .sub { color: var(--ink2); margin: 4px 0 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: min(92vw, 520px); padding: 10px 16px; background: var(--ink); color: var(--paper); border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 9; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 700px) { dl { grid-template-columns: 160px 1fr; } .row button { flex: 0 1 auto; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./ui/desk.ts"></script>
</body>
</html>
