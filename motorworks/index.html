<title>MotorWorks 1946</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: engineering workstation — menubar / explorer | document | inspector / status bar.
   Single light theme on purpose: neutral grey chrome, white documents, one selection blue. */
:root{
  color-scheme:light;
  --chrome:#e3e5e8; --chrome2:#d6d9dd; --panel:#f3f4f6; --paper:#ffffff; --line:#c5c9cf; --line2:#e2e4e8;
  --ink:#1a1d21; --mut:#5d646e; --sel:#1f5fbf; --selbg:#dce7f7; --good:#2b7a4b; --warn:#9a6200; --bad:#b3261e;
  --ui:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--ink);font:12.5px/1.45 var(--ui)}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
/* menubar */
.menubar{display:flex;align-items:center;gap:14px;background:var(--chrome);border-bottom:1px solid var(--line);padding-block:5px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));min-width:0}
.app{display:flex;align-items:center;gap:6px;color:var(--sel)}.app b{color:var(--ink);font-weight:700;letter-spacing:.01em}
.co{display:flex;flex-direction:column;line-height:1.15;font-weight:600;min-width:0;white-space:nowrap}.co small{font-weight:400;color:var(--mut);font-size:11px}
.ws{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:auto;flex:1;min-width:0}
.ws button{background:var(--panel);border:0;padding:5px 11px;cursor:pointer;white-space:nowrap}.ws button:hover{background:#fff}.ws button.on{background:var(--sel);color:#fff}
.file{display:flex;gap:4px}
/* body */
.body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.explorer{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.ts{margin-bottom:6px}.th{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;color:var(--mut);font-size:11px;font-weight:600}
.tadd{border:1px solid var(--line);background:var(--paper);border-radius:2px;width:18px;height:18px;line-height:14px;padding:0;cursor:pointer}
.tn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 10px 3px 18px;cursor:pointer}
.tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn:hover{background:var(--chrome)}.tn.on{background:var(--selbg);box-shadow:inset 2px 0 var(--sel)}.tn small{color:var(--mut)}
.doc{overflow:auto;background:var(--chrome);min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:100%}
.center{padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}.center.wide{max-width:1500px}
.insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-bottom:20px}
.dochead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dt{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;flex-wrap:wrap}.dt small{font-size:11.5px;font-weight:400;color:var(--mut)}
.in{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:3px 6px;min-width:0;max-width:100%}.in:focus{outline:2px solid var(--selbg);border-color:var(--sel)}
select.in{width:100%}.in.name{font-size:15px;font-weight:600;width:260px}.in.num{width:120px;text-align:right;font-family:var(--mono)}
.b{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:4px 10px;cursor:pointer;white-space:nowrap}.b:hover{border-color:var(--mut)}
.b.pri{background:var(--sel);border-color:var(--sel);color:#fff;font-weight:600}.b.pri:hover{background:#174d9e}.b.ghost{background:var(--paper)}.b.sm{padding:1px 7px;font-size:11.5px}
.b:focus-visible,.tn:focus-visible,.ws button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:10px 12px;min-width:0}.card.flush{padding:0;overflow:hidden}
.card h3,.center h3{margin:0 0 6px;font-size:12.5px;font-weight:600}.card h3 small{font-weight:400;color:var(--mut)}
.note{color:var(--mut);font-size:11.5px;margin:6px 0 0}
.mut{color:var(--mut)}.neg{color:var(--bad)}.bad{color:var(--bad)}.me{font-weight:700;color:var(--sel)}
.row{display:flex;gap:6px;align-items:center}.row.wrap{flex-wrap:wrap;align-items:flex-end}.row.tight{gap:3px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--paper);padding:6px 9px;display:flex;flex-direction:column;min-width:0}.kpi span{font-size:11px;color:var(--mut)}.kpi b{font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi small{font:11px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi.neg b{color:var(--bad)}
/* inspector */
.tabs{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:var(--chrome);padding:6px 4px;cursor:pointer;font-size:12px}.tabs button.on{background:var(--panel);font-weight:600;box-shadow:inset 0 2px var(--sel)}
fieldset{border:0;margin:0;padding:0;min-width:0}fieldset:disabled .pv{opacity:.6}
.grp{border-bottom:1px solid var(--line)}.grp summary{padding:6px 10px;font-weight:600;cursor:pointer;background:var(--chrome);list-style:none}.grp summary::before{content:'▾ ';color:var(--mut)}.grp:not([open]) summary::before{content:'▸ '}
.grpb{padding:6px 10px;display:flex;flex-direction:column;gap:5px}
.prop{display:grid;grid-template-columns:40% 60%;align-items:center;gap:6px;min-width:0}.prop label{color:var(--mut);font-size:12px;display:flex;flex-direction:column;line-height:1.2}.prop label small{font-size:10.5px;opacity:.85}.pv{min-width:0}
.center .prop{grid-template-columns:auto minmax(0,1fr)}
.rng{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.rng input{width:100%;accent-color:var(--sel)}.rng output{font:11.5px var(--mono);min-width:64px;text-align:right}
.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer}.chk.bad{color:var(--warn)}.chk .rng{width:140px}
.toolrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.file input{max-width:200px;font-size:11px}
/* viewports */
.vps{display:grid;gap:10px}.vps.two{grid-template-columns:1fr 1.4fr}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line2);font-family:var(--mono)}
canvas.vp{display:block;width:100%;height:330px;touch-action:none}canvas.vp.top{height:200px}canvas.vp.eng{height:290px}canvas.vp.short{height:250px}
canvas.curve{display:block;width:100%;height:190px}canvas.factory{display:block;width:100%}canvas.chart{display:block;width:100%}
details.cmp summary{cursor:pointer;font-weight:600}details.cmp canvas.vp{height:260px;margin-top:8px}
/* data */
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid var(--line2)}.kv span{color:var(--mut)}.kv b{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}.kv.sum b{color:var(--sel)}
.bar{display:block;height:6px;background:var(--line2);border-radius:1px;overflow:hidden;min-width:40px;flex:1}.bar i{display:block;height:100%;background:var(--sel)}.bar.g i{background:var(--good)}.bar.r i{background:var(--bad)}
.rr{display:grid;grid-template-columns:72px 1fr 26px 30px;gap:8px;align-items:center;padding:1px 0}.rr b{font:500 11.5px var(--mono);text-align:right}.rr em{font:normal 11px var(--mono);text-align:right}.rr em.up{color:var(--good)}.rr em.dn{color:var(--bad)}
.fit div,.share div,.balance div{display:grid;grid-template-columns:90px 1fr 50px;gap:8px;align-items:center;padding:1px 0}.fit .top span{color:var(--sel);font-weight:600}.fit b,.share b,.balance b{font:11.5px var(--mono);text-align:right}
.share div{grid-template-columns:12px 130px 1fr 50px}.share .me span{color:var(--sel);font-weight:700}.balance .bn span{color:var(--bad);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:5px;vertical-align:-1px}.sw.big{width:14px;height:14px}
.chip{display:inline-block;font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--mut);white-space:nowrap;background:var(--paper)}
.chip.dev{color:var(--warn);border-color:#e0c48a;background:#fdf6e7}.chip.ready{color:var(--sel);border-color:#a9c3ea;background:#eef4fc}.chip.production{color:var(--good);border-color:#a7d1b6;background:#eef8f1}.chip.bad{color:var(--bad);border-color:#e6aaa5;background:#fcefee}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:12px}.tb th{text-align:left;font-weight:600;color:var(--mut);background:var(--panel);border-bottom:1px solid var(--line);padding:4px 7px;cursor:pointer;white-space:nowrap;user-select:none}
.tb td{padding:4px 7px;border-bottom:1px solid var(--line2);vertical-align:middle}.tb .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}.tb tr.click{cursor:pointer}.tb tr.click:hover td{background:#f3f7fd}.tb tr.on td{background:var(--selbg)}
.tb.dense td{padding:2px 7px}.tb.fin tr.sum td{font-weight:600;border-bottom:1px solid var(--line)}.tb td.on,.tb span.on{color:var(--sel);font-weight:600}
.warn{color:var(--warn);margin:4px 0}.warnbox{border:1px solid #e0c48a;background:#fdf6e7;color:#6e4a00;padding:6px 10px;border-radius:2px}.warnbox p{margin:2px 0}
.log{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}.log li{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid var(--line2)}.log time{font:11px var(--mono);color:var(--mut);white-space:nowrap}
.log li.good{color:var(--good)}.log li.bad{color:var(--bad)}.log li.warn{color:var(--warn)}.log li.rival{color:#4a5563}.log li.mut{opacity:.55}
.steps{margin:0;padding-left:20px}.steps li{padding:1px 0}.steps li.ok{color:var(--mut);text-decoration:line-through}.lnk{background:none;border:0;padding:0;color:var(--sel);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.proj{display:grid;grid-template-columns:1fr 1fr 64px;gap:8px;align-items:center;padding:2px 0}.proj b{font:11px var(--mono);text-align:right}
.rcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.segbars div{display:grid;grid-template-columns:72px 1fr 34px;gap:6px;align-items:center;font-size:11px}.segbars b{font:10.5px var(--mono);text-align:right}
.line{border-top:1px solid var(--line2);padding-top:8px;margin-top:8px}.econ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px;margin-top:6px}
.reviews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rv{border:1px solid var(--line2);padding:8px;border-radius:2px}.rv header{display:flex;justify-content:space-between;align-items:baseline}.rv strong{font:600 20px var(--mono);color:var(--sel)}.rv p{margin:4px 0}.rv small{display:block;color:var(--mut)}.rv .cmpres{color:var(--ink);margin-top:4px}
.trim{border:1px solid var(--line2);padding:6px;display:flex;flex-direction:column;gap:4px;border-radius:2px;background:var(--paper)}
.regions{margin:6px 0}
.empty{padding:40px;text-align:center}
.errbox{white-space:pre-wrap;color:var(--bad);padding:12px}
/* status bar */
.status{display:flex;align-items:stretch;gap:0;background:#2b2f35;color:#e8eaed;font-size:12px;min-width:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.clock{display:flex;gap:1px;padding:3px 6px}.clock button{background:#3b4048;border:0;color:#e8eaed;padding:3px 8px;cursor:pointer;font-size:11px}.clock button.on{background:var(--sel)}
.sb{display:flex;flex-direction:column;justify-content:center;padding:2px 12px;border-left:1px solid #43484f;line-height:1.15;white-space:nowrap}.sb span{font-size:10px;color:#a9b0b9}.sb b{font:500 12.5px var(--mono)}.sb.neg b,.sb b.neg{color:#ff8f86}
.ticker{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px;border-left:1px solid #43484f;overflow:hidden;white-space:nowrap;min-width:0}.ticker span{overflow:hidden;text-overflow:ellipsis;color:#cfd4da}.ticker .evt{color:#ffc56b;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.45);display:grid;place-items:center;z-index:30;padding:16px}.dlg{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px;max-width:500px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.dlg h2{margin:0;font-size:17px}.dlg p{margin:0;color:var(--mut)}
#toasts{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:40}.toast{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--sel);padding:7px 11px;max-width:360px;box-shadow:0 4px 14px rgba(0,0,0,.15)}.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}
@media (max-width:1250px){.rcs{grid-template-columns:repeat(2,minmax(0,1fr))}.reviews{grid-template-columns:1fr}}
@media (max-width:1000px){.body{grid-template-columns:1fr}.explorer{display:none}.split{grid-template-columns:1fr}.insp{border-left:0;border-top:1px solid var(--line)}.vps.two{grid-template-columns:1fr}.co{display:none}}
@media (max-width:700px){.cols2,.grid3{grid-template-columns:1fr}.econ{grid-template-columns:1fr 1fr}.file{display:none}.ticker{display:none}.sb{padding:2px 7px}.menubar{flex-wrap:wrap}.ws{flex-basis:100%;order:3}canvas.vp{height:230px}.in.name{width:100%}}
@media (max-width:480px){.rcs{grid-template-columns:1fr}.sb:nth-child(n+5){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="src/util.js"></script>
<script src="src/data/world.js"></script>
<script src="src/data/tech.js"></script>
<script src="src/data/bodies.js"></script>
<script src="src/sim/engine.js"></script>
<script src="src/sim/powertrain.js"></script>
<script src="src/sim/car.js"></script>
<script src="src/sim/platform.js"></script>
<script src="src/sim/autodesign.js"></script>
<script src="src/sim/market.js"></script>
<script src="src/sim/rivals.js"></script>
<script src="src/sim/company.js"></script>
<script src="src/render/textures.js"></script>
<script src="src/render/carRender.js"></script>
<script src="src/render/engineRender.js"></script>
<script src="src/render/factoryRender.js"></script>
<script src="src/ui/app.js"></script>
<script src="src/ui/design.js"></script>
<script src="src/ui/ops.js"></script>
<script src="src/ui/world.js"></script>
<script>MW.ui.start();</script>
