<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desert Steel</title>
<style>
  :root { color-scheme: dark; --tx: #f3ead8; --mu: #b9ab90; --bg: rgba(24,19,12,.62); --ok: #7fe08f; --warn: #ffcc66; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9b48a; color: var(--tx);
    font: 13px/1.35 system-ui, -apple-system, 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
  canvas#view { position: fixed; inset: 0; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; background: #2a2116; z-index: 10; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(3px); border-radius: 8px; padding: 8px 10px; pointer-events: none; }
  #hud { top: 10px; left: 10px; min-width: 230px; }
  #hud .t { font-weight: 800; letter-spacing: .08em; font-size: 12px; color: var(--warn); margin-bottom: 4px; }
  #hud .r { display: flex; justify-content: space-between; gap: 14px; }
  #hud .r span:first-child { color: var(--mu); }
  #hud .r b { font-variant-numeric: tabular-nums; font-weight: 600; }
  #h-load.ready { color: var(--ok); }
  #help { top: 10px; right: 10px; max-width: 300px; }
  #help.hide { display: none; }
  #help kbd { display: inline-block; min-width: 18px; padding: 0 4px; border: 1px solid #8a7b60; border-radius: 3px; font: 11px monospace; text-align: center; }
  #mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; width: min(60vw, 520px); height: 46px; border-radius: 6px; pointer-events: none; }
  #touch { position: fixed; inset: auto 0 64px 0; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  #touch .g { display: flex; gap: 10px; pointer-events: auto; }
  #touch button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(30,24,16,.5); color: #fff; font-size: 20px; touch-action: none; }
  #touch button.on { background: rgba(255,204,102,.55); }
  #touch button.fire { width: 78px; height: 78px; background: rgba(160,40,20,.6); font-size: 15px; font-weight: 800; }
  #zoombar { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  #zoombar button { background: var(--bg); color: var(--tx); border: 1px solid #6b5d45; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
  @media (max-width: 640px) { #hud { min-width: 0; font-size: 11px; } #mini { bottom: 150px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">불러오는 중…</div>

<div id="hud" class="panel">
  <div class="t">M1A1 · DESERT STEEL — M2 데모</div>
  <div class="r"><span>속도</span><b id="h-spd">0</b></div>
  <div class="r"><span>궤도 속도</span><b id="h-trk">0</b></div>
  <div class="r"><span>엔진 출력</span><b id="h-pwr">0</b></div>
  <div class="r"><span>슬립</span><b id="h-slip">0</b></div>
  <div class="r"><span>침하</span><b id="h-sink">0</b></div>
  <div class="r"><span>토양</span><b id="h-soil">-</b></div>
  <div class="r"><span>차체 경사</span><b id="h-pitch">0</b></div>
  <div class="r"><span>포 앙각</span><b id="h-elev">0</b></div>
  <div class="r"><span>탄종</span><b id="h-ammo">-</b></div>
  <div class="r"><span>장전</span><b id="h-load">-</b></div>
  <div class="r"><span>마지막 탄착</span><b id="h-hit">—</b></div>
  <div class="r"><span>위치</span><b id="h-pos">0</b></div>
  <div class="r"><span>줌 / 프레임</span><b><span id="h-zoom"></span> · <span id="h-fps"></span></b></div>
</div>

<div id="help" class="panel">
  <div><kbd>A</kbd><kbd>D</kbd> 후진 / 전진 (놓으면 제동)</div>
  <div><kbd>W</kbd><kbd>S</kbd> 포 앙각: 탭 0.1° · 누르면 점점 빠르게 · <kbd>Shift</kbd> 미세(0.02°)</div>
  <div><kbd>Space</kbd> / 좌클릭 사격 · <kbd>Q</kbd> 탄종 전환</div>
  <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 근접 / 전투 / 전술 줌 · 휠 연속 줌</div>
  <div><kbd>C</kbd> 마우스 위치에 크레이터 · <kbd>R</kbd> 차량 리셋</div>
  <div><kbd>F9</kbd> 물리 디버그 · <kbd>H</kbd> 도움말 숨김</div>
</div>

<canvas id="mini"></canvas>
<div id="zoombar"><button data-z="0">근접</button><button data-z="1">전투</button><button data-z="2">전술</button></div>
<div id="touch">
  <div class="g"><button data-t="drive:-1">◀</button><button data-t="drive:1">▶</button></div>
  <div class="g"><button data-t="elev:1">▲</button><button data-t="elev:-1">▼</button><button class="fire" data-t="fire">사격</button></div>
</div>

<script src="src/core/Tuning.js"></script>
<script src="data/vehicles/m1a1.js"></script>
<script src="data/ammo/ammo.js"></script>
<script src="src/world/Terrain.js"></script>
<script src="src/vehicle/Track.js"></script>
<script src="src/vehicle/Vehicle.js"></script>
<script src="src/ballistics/Projectile.js"></script>
<script src="src/fx/Particles.js"></script>
<script src="src/fx/Effects.js"></script>
<script src="src/core/Camera.js"></script>
<script src="src/render/Renderer.js"></script>
<script src="src/debug/DebugLayer.js"></script>
<script src="src/core/World.js"></script>
<script src="src/core/Game.js"></script>
</body>
</html>
