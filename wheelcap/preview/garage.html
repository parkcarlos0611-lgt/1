<title>Wheelcap Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* layout: one-screen viewer; the car fills the stage, a slim header above and a control strip below */
:root{--bg:#e9ecf1;--stage:#dfe3ea;--fg:#151922;--muted:#5a6375;--line:#c3c9d4;--panel:#f7f8fa;--accent:#1f4fd8;--on-accent:#fff;
--display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;--body:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--stage:#1b2029;--fg:#eef1f6;--muted:#9aa4b6;--line:#2f3644;--panel:#181c24;--accent:#6f9bff;--on-accent:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--stage:#1b2029;--fg:#eef1f6;--muted:#9aa4b6;--line:#2f3644;--panel:#181c24;--accent:#6f9bff;--on-accent:#0b1020;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header,footer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-size:1.15rem;margin:0;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--muted);font-size:.82rem}
.stats{margin-left:auto;font-family:var(--display);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
#stage{flex:1;min-height:0;position:relative;background:var(--stage)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:absolute;inset:auto 0 12px 0;text-align:center;color:var(--muted);font-size:.8rem;pointer-events:none}
footer{padding-block:10px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:500 .88rem var(--body);padding:9px 14px;min-height:44px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;align-items:center;gap:6px;font-size:.88rem;min-height:44px}
input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:4px;background:none;padding:0}
</style>
<header><h1>Wheelcap Garage</h1><span class="sub">R34 기준 차 · 차체 v3</span><span class="stats" id="stats">불러오는 중</span></header>
<div id="stage"><div id="msg">끌어서 돌리기 · 두 손가락으로 확대</div></div>
<footer>
<div class="seg" role="group" aria-label="비율"><button id="b-chibi" aria-pressed="true">데포르메</button><button id="b-real" aria-pressed="false">실차 비율</button></div>
<label><input type="checkbox" id="c-lines" checked> 외곽선</label>
<label><input type="checkbox" id="c-spin" checked> 자동 회전</label>
<label>차체 색 <input type="color" id="c-paint" value="#1f4fd8"></label>
</footer>

camera.position.set(-4.3,1.9,4.4);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=14;controls.maxPolarAngle=Math.PI*0.49;controls.autoRotate=true;controls.autoRotateSpeed=1.2;
scene.add(new THREE.HemisphereLight(0xffffff,0x8890a0,0.3));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(-3,6,4);scene.add(sun);
// three-step toon ramp
const ramp=new THREE.DataTexture(new Uint8Array([110,110,110,255,185,185,185,255,255,255,255,255]),3,1,THREE.RGBAFormat);
ramp.minFilter=ramp.magFilter=THREE.NearestFilter;ramp.needsUpdate=true;
const ground=new THREE.Mesh(new THREE.CircleGeometry(9,48),new THREE.MeshBasicMaterial());ground.rotation.x=-Math.PI/2;scene.add(ground);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22}));shadow.rotation.x=-Math.PI/2;shadow.position.y=0.004;scene.add(shadow);
const lineMat=new THREE.LineBasicMaterial({color:0x0b0d12});
const cars={};let current='chibi',paint=new THREE.Color('#1f4fd8');
function bytes(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function prepare(g){
  let tris=0,parts=0;const lines=new THREE.Group();lines.name='lines';
  g.traverse(o=>{if(!o.isMesh)return;parts++;
    const src=o.material,glass=src.name==='glass';
    o.material=new THREE.MeshToonMaterial({color:src.color.clone(),gradientMap:ramp,transparent:glass,opacity:glass?0.42:1,side:THREE.DoubleSide,depthWrite:!glass});
    o.material.name=src.name;if(glass)o.renderOrder=2;
    tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;
    if(!glass){const l=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,22),lineMat);o.updateWorldMatrix(true,false);l.applyMatrix4(o.matrixWorld);lines.add(l)}
  });
  g.add(lines);g.userData={tris,parts};
  const box=new THREE.Box3().setFromObject(g);g.userData.box=box;
}
function show(name){
  current=name;for(const k in cars)cars[k].visible=k===name;
  const g=cars[name];if(!g)return;
  const b=g.userData.box,c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());
  controls.target.set(c.x,s.y*0.42,c.z);shadow.scale.set(s.x*1.04,s.z*1.02,1);shadow.position.x=c.x;shadow.position.z=c.z;
  document.getElementById('b-chibi').setAttribute('aria-pressed',name==='chibi');document.getElementById('b-real').setAttribute('aria-pressed',name==='real');
  setPaint();label();
}
function setPaint(){for(const k in cars)cars[k].traverse(o=>{if(o.isMesh&&o.material.name==='paint')o.material.color.copy(paint)})}
let fps=0;function label(){const g=cars[current];if(g)stats.textContent=`부품 ${g.userData.parts} · 삼각형 ${Math.round(g.userData.tris)} · ${fps} fps`}
const loader=new THREE.GLTFLoader();
for(const k of ['chibi','real'])loader.parse(bytes(GLB[k]),'',r=>{const g=r.scene;prepare(g);g.visible=false;scene.add(g);cars[k]=g;if(k===current||!cars[current])show(current in cars?current:k)},e=>{stats.textContent='모델을 불러오지 못했습니다'});
function theme(){scene.background=new THREE.Color(css('--stage'));ground.material.color.set(css('--stage')).offsetHSL(0,0,-0.035)}
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?44:32;camera.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
document.getElementById('b-chibi').onclick=()=>show('chibi');document.getElementById('b-real').onclick=()=>show('real');
document.getElementById('c-lines').onchange=e=>{for(const k in cars)cars[k].getObjectByName('lines').visible=e.target.checked};
const spin=document.getElementById('c-spin');spin.onchange=()=>controls.autoRotate=spin.checked;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){spin.checked=false;controls.autoRotate=false}
document.getElementById('c-paint').oninput=e=>{paint.set(e.target.value);setPaint()};
let n=0,t0=performance.now();
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);
  if(++n>=30){const t=performance.now();fps=Math.round(30000/(t-t0));t0=t;n=0;label()}})();
</script>
