<title>Cage Legends</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark}:root{--bg:#0a0b0e;--bg2:#121419;--bg3:#1a1d24;--ln:#2a2e38;--tx:#eef0f4;--mu:#8b92a1;--red:#d4141b;--blue:#1f5fd6;--gold:#f2b544;--grn:#2fd47a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.btn.ghost{background:transparent;border:1px solid var(--ln)}.btn.gold{background:var(--gold);color:#111}.btn.blue{background:var(--blue)}.btn:disabled{opacity:.4}

.hrow{display:flex;gap:3px;background:rgba(0,0,0,.55);padding:4px;clip-path:polygon(0 0,100% 0,97% 100%,0 100%)}.hp1 .hrow{flex-direction:row-reverse;clip-path:polygon(0 0,100% 0,100% 100%,3% 100%)}
.hb{flex:1;display:flex;align-items:center;gap:3px}.hb i{font-style:normal;font-size:11px;opacity:.8}.hb b{flex:1;height:11px;background:#1d2a22;display:block;overflow:hidden}.hb s{display:block;height:100%;background:var(--grn);transition:width .15s}
.hp1 .hb{flex-direction:row-reverse}.hp1 .hb s{margin-left:auto}
.hst{height:7px;background:#2a2410;margin:3px 0 0;position:relative;overflow:hidden}.hst s{display:block;height:100%;background:linear-gradient(90deg,#f0a51c,#f6d34a)}.hst:after{content:'';position:absolute;top:0;bottom:0;left:var(--mx,100%);right:0;background:repeating-linear-gradient(45deg,#000 0 3px,#222 3px 6px)}
.hp1 .hst{transform:scaleX(-1)}
.hnm{margin-top:3px;background:linear-gradient(90deg,var(--c),transparent);padding:3px 8px;font-weight:700;font-size:14px;letter-spacing:.05em}.hp1 .hnm{text-align:right;background:linear-gradient(-90deg,var(--c),transparent)}.hnm small{margin:0 8px;opacity:.8;font-size:11px}
.hclock{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center}.hclock .hr{background:#fff;color:#111;font-weight:800;font-size:12px;padding:1px 10px}.hclock .ht{font-size:24px;font-weight:700;text-shadow:0 2px 6px #000}

.hlow span{padding:4px 14px}.hlow b{padding:4px 10px;color:#fff}.hlow em{font-style:normal;padding:4px 8px;border-left:1px solid #333}.hwc{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;background:#000;color:#aaa;padding:1px}
.hlog{position:absolute;left:12px;bottom:70px;max-width:46vw}.lg{background:rgba(8,9,12,.86);color:#fff;margin-top:4px;padding:4px 10px;font-size:13px;border-left:3px solid #888;font-family:'Noto Sans KR',sans-serif;animation:lgin .25s}.lg.s0{border-color:var(--red)}.lg.s1{border-color:var(--blue)}
@keyframes lgin{from{opacity:0;transform:translateX(-12px)}}

.hbtn{position:absolute;top:84px;right:12px;display:flex;gap:6px;pointer-events:auto}.hbtn button{background:rgba(0,0,0,.55);border:1px solid #333;border-radius:6px;width:34px;height:30px;cursor:pointer}
.hgw{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:none;font-family:'Noto Sans KR',sans-serif;text-align:center;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:10px}

.gw b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:12px}

.sbt{font-weight:800;color:var(--gold)}.sbg{position:relative;height:14px;background:#333;margin:8px 0 2px;border-radius:7px;overflow:hidden}.sbg s{display:block;height:100%;background:linear-gradient(90deg,#3c8,#fc3,#f43)}.sbg i{position:absolute;top:0;bottom:0;width:2px;background:#000}
.sbl{display:flex;justify-content:space-between;font-size:11px;color:#aaa}.sbp{margin-top:6px;font-size:14px}.sbp b{font-size:28px;color:#fff;display:inline-block;min-width:30px;animation:pulse .3s infinite alternate}

.ovb{background:#111318;border:1px solid #2a2e38;border-radius:12px;padding:20px 22px;min-width:min(90vw,340px);max-width:94vw;max-height:88vh;overflow:auto;text-align:center;font-family:'Noto Sans KR',sans-serif}

.tip{font-size:13px;color:#cfd3da;max-width:360px;margin:8px auto}
.res .rw{font-family:Oswald;font-size:34px;font-weight:800;color:var(--gold)}.res .rm{font-size:18px;font-weight:800}.res .rt{color:#aaa;font-size:13px}.cards{display:flex;gap:10px;justify-content:center;margin-top:8px;font-size:12px;color:#ccc;flex-wrap:wrap}

.tstick{position:absolute;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);touch-action:none}.tknob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.22)}
.tpad{position:absolute;right:18px;bottom:24px;width:156px;height:156px}.fb{position:absolute;width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);font-size:20px;touch-action:none;display:grid;place-items:center;line-height:1}
.fb i{font-style:normal;font-size:9px;position:absolute;bottom:4px;opacity:.75}.fb.on{background:rgba(255,255,255,.35)}
.ftr{left:50px;top:0;color:#5fe0a0}.fsq{left:0;top:50px;color:#e98ee0}.fo{right:0;top:50px;color:#ff7a7a}.fx{left:50px;bottom:0;color:#7ab3ff}

.tdir{position:absolute;right:30px;bottom:200px;width:110px;height:84px}.tdir button{position:absolute;width:38px;height:30px;padding:0}.tdir button:nth-child(1){left:36px;top:0}.tdir button:nth-child(2){left:0;top:27px}.tdir button:nth-child(3){right:0;top:27px}.tdir button:nth-child(4){left:36px;bottom:0}
.tgr{position:absolute;left:150px;bottom:24px;display:flex;gap:6px}.tsw{position:absolute;left:18px;bottom:156px;font-size:10px;background:rgba(0,0,0,.5);border:1px solid #444;border-radius:6px;padding:3px 7px}

@media (max-width:700px){.hp0,.hp1{width:44vw}.hnm{font-size:11px}.hclock .ht{font-size:18px}.hlow{font-size:11px;bottom:auto;top:62px}.hlog{bottom:160px;max-width:70vw}.lg{font-size:11px}.hgw{top:auto;bottom:220px;transform:none;right:8px}.gw{width:170px;height:100px}}
/* ===== career UI ===== */
#app{min-height:100%}
.page{max-width:980px;margin:0 auto;padding:16px 16px 60px}

.a1{color:#8b92a1}.a2{color:#d7dae2}.a3{color:#7fd4ff}.a4{color:#2fd47a}.a5{color:var(--gold)}

  simRest(){this.quickEnd=1;const r=simFight(this.f[0],this.f[1],this.rules,{from:this.round});this.phase='fight';if(r.round>this.round){this.round=r.round;this.clock=(this.round===1&&this.rules.firstLen?this.rules.firstLen:this.rules.len)}const len=(this.round===1&&this.rules.firstLen)?this.rules.firstLen:this.rules.len;this.clock=Math.min(this.clock,Math.max(1,len-r.time));this.finish(this.f[r.w],r.method,r.detail+' (시뮬레이션)',.1)}
  showBreak(){const rs=this.rs;const row=(l,a,b)=>`<tr><td>${a}</td><th>${l}</th><td>${b}</td></tr>`;const P=this.f[this.pi==null?0:this.pi];
    const tip=P.body.cuts.length?'컷 지혈 중... 가드 올리고 머리 움직여! 또 맞으면 닥터 스톱이야.':P.hp.legs<45?'다리 많이 상했어. 블록 누른 채 스틱 아래로 체크해!':P.opp.hp.body<55?'바디 먹히고 있다. 펀치 아래 스와이프로 계속 바디!':P.sta<40?'숨 골라. 잽으로 거리 재고 큰 거 아껴.':P.opp.hp.head<55?'상대 흔들렸어! 컴비네이션으로 끝내!':pick(['잽으로 상대 펀치를 끊어.','훅엔 블록 → 스와이프, 어퍼엔 블록 ← 스와이프!','가드 게이지 바닥나면 가드가 무너져. 거리 벌려.','카운터로 턱을 노려!']);
    this.showOv(`<h3>ROUND ${this.round} 종료</h3><table class="rst">${row('유효타',rs[0].sigL,rs[1].sigL)}${row('다운',rs[0].kd,rs[1].kd)}${row('테이크다운',rs[0].td,rs[1].td)}${row('컨트롤',fmtT(rs[0].ctrl),fmtT(rs[1].ctrl))}</table><p class="tip">🗣️ 코너: ${tip}</p>${this.cornerHTML()}<button class="btn" data-n>ROUND ${this.round+1} 시작</button>`);
    this.H.ov.querySelector('[data-n]').onclick=()=>this.nextRound();this.cornerPick=this.cornerPick||'rest';this.H.ov.querySelectorAll('[data-cn]').forEach(b=>b.onclick=()=>{this.cornerPick=b.dataset.cn;this.H.ov.querySelectorAll('[data-cn]').forEach(x=>x.classList.toggle('on',x===b))});if(this.pi==null)setTimeout(()=>this.phase==='break'&&this.nextRound(),1500)}
  cornerHTML(){if(this.pi==null)return'';const me=this.pi;let sc='';
    if(this.rules.judging!=='whole'){const last=this.cards.map(c=>c[c.length-1]).filter(Boolean);const won=last.filter(x=>x[me]>x[1-me]).length,lost=last.filter(x=>x[me]<x[1-me]).length;
      const tot=this.cards.map(c=>c.reduce((s,x)=>[s[0]+x[me],s[1]+x[1-me]],[0,0]));const lead=tot.filter(t=>t[0]>t[1]).length,trail=tot.filter(t=>t[0]<t[1]).length;
      sc=`<div class="cscore">📋 코너 채점: 이번 라운드 ${won>lost?'<b class="pos">우리가 가져갔다</b>':lost>won?'<b class="neg">내준 것 같다</b>':'반반이다'} · 누적 ${lead>trail?'리드 중':trail>lead?'<b class="neg">끌려가는 중</b>':'박빙'}</div>`}
    const P=this.f[me];const C=[['rest','🫁 회복','체력·데미지 회복'],['cut','🩹 컷맨',P.body.cuts.length?'출혈·붓기 처치':'붓기 처치'],['attack','🔥 압박','파워·정확도↑ 체력↓'],['defend','🛡️ 수비','타격·TD 방어↑'],['wrestle','🤼 레슬링','TD·상위 컨트롤↑']];
    const pk=this.cornerPick||'rest';return`${sc}<div class="cnr">${C.map(([k,n,d])=>`<button data-cn="${k}" class="${pk===k?'on':''}">${n}<small>${d}</small></button>`).join('')}</div>`}
  cpuCorner(f){const i=f.side,rs=this.rs;if(f.body.cuts.length&&(f.bleed||0)>8)return'cut';if(f.sta<45)return'rest';
    const mine=rs[i].sigL+rs[i].kd*16+rs[i].td*3.5,theirs=rs[1-i].sigL+rs[1-i].kd*16+rs[1-i].td*3.5;if(mine<theirs-4)return this.f[i].ai&&this.f[i].ai.gr?'wrestle':'attack';
    if(f.opp.hp.head<55)return'attack';return Math.random()<.5?'rest':'defend'}
  applyCorner(){const NM={rest:'회복',cut:'컷맨 처치',attack:'압박 지시',defend:'수비 지시',wrestle:'레슬링 지시'};
    for(const f of this.f){const ch=f.side===this.pi?(this.cornerPick||'rest'):this.cpuCorner(f);f.A0=f.A0||f.A;const A=Object.assign({},f.A0);const add=(k,v)=>A[k]=clamp((A[k]||10)+v,1,20);
      if(f.ai){f.ai.aggr0=f.ai.aggr0==null?f.ai.aggr:f.ai.aggr0;f.ai.aggr=f.ai.aggr0}
      if(ch==='rest'){f.sta=Math.min(f.staMax,f.sta+18);for(const k of['head','body','legs'])f.hp[k]=Math.min(100,f.hp[k]+5)}
      else if(ch==='cut'){f.body.cuts.forEach(c=>c.sev*=.45);f.bleed=(f.bleed||0)*.35;f.body.swell*=.6;f.hp.head=Math.min(100,f.hp.head+3)}
      else if(ch==='attack'){add('punchPow',1.5);add('accuracy',1.5);add('handSpd',1);add('aggression',3);f.sta=Math.max(10,f.sta-8);if(f.ai)f.ai.aggr=Math.min(1,f.ai.aggr+.2)}
      else if(ch==='defend'){add('strDef',2);add('tdd',2);add('footwork',1);add('aggression',-2);if(f.ai)f.ai.aggr=Math.max(0,f.ai.aggr-.15)}
      else if(ch==='wrestle'){add('takedown',2);add('topCtl',1.5);add('clinchCtl',1)}
      f.A=A;if(f.side!==this.pi)this.ev(`🗣️ ${f.name} 코너: ${NM[ch]}`)}}
  showResult(){const r=this.result;const W=r.winner<0?null:this.f[r.winner];const st=r.stats;const row=(l,a,b)=>`<tr><td>${a}</td><th>${l}</th><td>${b}</td></tr>`;
    const cards=r.method==='DEC'&&!(r.extra&&r.extra.whole)?`<div class="cards">${this.cards.map((cd,j)=>{const t=cd.reduce((s,x)=>[s[0]+x[0],s[1]+x[1]],[0,0]);return`<span>심판 ${j+1}: ${t[0]}-${t[1]}</span>`}).join('')}</div>`:r.extra&&r.extra.whole?'<div class="cards"><span>전체 경기 판정제</span></div>':'';
    this.showOv(`<div class="rw">${W?esc2(W.name):'DRAW'}</div><div class="rm">${{KO:'KO',TKO:'TKO',SUB:'서브미션',DEC:'판정',DRAW:'무승부'}[r.method]} ${r.detail?'· '+esc2(r.detail):''}</div><div class="rt">${r.round}라운드 ${fmtT(r.time)}</div>${cards}
      <table class="rst">${row('유효타',st[0].sigL,st[1].sigL)}${row('총 타격',st[0].land+'/'+st[0].thr,st[1].land+'/'+st[1].thr)}${row('다운',st[0].kd,st[1].kd)}${row('테이크다운',st[0].td+'/'+st[0].tdA,st[1].td+'/'+st[1].tdA)}${row('서브 시도',st[0].sub,st[1].sub)}${row('컷',st[0].cuts,st[1].cuts)}</table><button class="btn" data-c>계속</button>`);
    this.H.ov.querySelector('[data-c]').onclick=()=>{const res=this.result;this.destroy();this.onEnd&&this.onEnd(res)}}
}

function wcSteps(P){const n=WCK.indexOf(P.wc0||P.wc),c=WCK.indexOf(P.wc);return c-n}
function wcShift(P,wc){const n=WCK.indexOf(P.wc0||P.wc),st=WCK.indexOf(wc||P.wc)-n;if(!st)return{};const cutA=clamp(((P.A.weightCut||10)-1)/19,0,1),k=Math.abs(st);const D={};
  const add=(a,v)=>D[a]=Math.round(((D[a]||0)+v)*10)/10;
  if(st>0){add('cardio',(1.6-cutA*1.4)*k);add('chin',(.9-cutA*.6)*k);add('recovery',.5*k);add('strength',-1.3*k);add('punchPow',-.9*k);add('tdd',-.9*k);add('clinchCtl',-.6*k);add('speed',.4*k);add('handSpd',.3*k)}
  else{add('cardio',-(1.9-cutA*1.3)*k);add('chin',-(1.1-cutA*.7)*k);add('recovery',-.5*k);add('strength',1.2*k);add('punchPow',.8*k);add('tdd',.7*k);add('clinchCtl',.5*k);add('speed',-.3*k)}
  return D}
function wcBw(P,wc){const n=WC[P.wc0||P.wc],w=WC[wc||P.wc];return n.bw*(1+.6*(w.bw/n.bw-1))}

  let fame=won?3:0,hype=won?6:0;const callout=findCallout(C,ans);if(callout){hype+=6;fame+=1}if(/(감사|가족|팬)/.test(ans))fame+=1;if(/(누구든|다 덤벼|챔피언)/.test(ans))hype+=5;if(ans.length<4)hype-=3;

  wrestle:['🤼 레슬링 캠프','테이크다운·TD방어·상위 컨트롤·클린치',{takedown:1.5,tdd:1.2,topCtl:1,clinchCtl:.8}],
  bjj:['🔒 주짓수 캠프','서브미션 공격·방어·하위 포지션·겟업',{subOff:1.5,subDef:1.5,bottom:1,getup:.8}],
  cond:['🫁 컨디셔닝 캠프','체력·회복·근력',{cardio:1.8,recovery:1.2,strength:.5}]};
const COUNTER={'타격':{strDef:1.6,footwork:1.2,chin:.4,fightIQ:1},'그래플링':{tdd:1.8,getup:1.4,subDef:1.2,fightIQ:1},'신체':{cardio:1,footwork:1,fightIQ:1.2,composure:1},'정신':{composure:1.2,fightIQ:1.2,heart:1}};
const CAMP_INT={light:['가벼운 캠프',.6,'피로도 -15, 부상 위험 없음'],normal:['정상 캠프',1,'피로도 +5'],hard:['지옥 캠프',1.6,'효과 1.6배 · 비용 증가 · 피로도에 따라 부상 위험']};
function scoutReport(o){const O=grpOvr(o.A);const g=O.g.slice().sort((a,b)=>b[1]-a[1]);const top=AKEYS.filter(k=>k!=='charisma').sort((a,b)=>(o.A[b]||10)-(o.A[a]||10));
  return{best:g[0][0],worst:g[g.length-1][0],str:top.slice(0,3),weak:top.slice(-3).reverse(),tot:O.tot}}
function campCost(P,int){const g=GYMS[P.gym]||[0,0,0,0,0,300];return Math.round((g[5]||300)*(int==='hard'?8:int==='light'?2:4))}
function campHurtRisk(P){return Math.round(clamp(8+(P.fat||0)*.5,8,55))}
function runCamp(P,o,focus,int){const sr=scoutReport(o);const base=focus==='counter'?COUNTER[sr.best]:CAMPS[focus][2];const k=CAMP_INT[int][1];const mods={};for(const a in base)mods[a]=+(base[a]*k).toFixed(2);
  let inj=false;if(int==='hard'&&Math.random()*100<campHurtRisk(P)){inj=true;for(const a in mods)mods[a]=+(mods[a]*.5).toFixed(2);mods.cardio=(mods.cardio||0)-1;mods.chin=(mods.chin||0)-.8;P.fat=clamp((P.fat||0)+10,0,100)}
  P.fat=clamp((P.fat||0)+(int==='light'?-15:int==='hard'?12:5),0,100);const cost=campCost(P,int);P.money-=cost;if(P.stats)P.stats.spend=(P.stats.spend||0)+cost;
  return{focus,int,mods,inj,cost,label:focus==='counter'?`🧠 맞춤 전략 (vs ${sr.best})`:CAMPS[focus][0]}}
function fightWeek(){const P=GG.P,nx=P.next;if(!nx)return;const o=GG.F[nx.opp];const turns=[];nx.bad=nx.bad||0;nx.hype=0;
  const step1=()=>{const myAssets=P.assets.filter(a=>['car','watch','jew','boat','air'].includes(a.c));
    app().innerHTML=`<div class="page fw"><div class="fwh"><span class="H">FIGHT WEEK</span><b>${nx.ev}</b><em>${esc2(P.name)} vs ${dn(o)}</em></div>
     <div class="card press"><h3>🎤 기자회견 ${SAMPLE?'<small class="aitag">Claude 실시간</small>':''}</h3><div class="chat" data-chat><div class="msg sys">기자: "${nx.title?'타이틀전입니다.':'이번 경기,'} 두 선수 한마디씩 부탁드립니다."</div></div>
      <div class="row"><select data-flex><option value="">자산 과시 안 함</option>${myAssets.map(a=>`<option value="${a.id}">${ACAT[a.c][0]} ${esc2(a.n)}</option>`).join('')}</select><label class="sm"><input type="checkbox" data-wag ${myAssets.length?'':'disabled'}> 이 자산 걸고 내기 제안</label></div>
      <div class="row"><input class="inp" data-line placeholder="트래시토크 / 각오 (자유 입력)" maxlength="160"><button class="btn" data-say>발언</button></div><div class="row"><button class="btn ghost sm" data-skip>${turns.length?'기자회견 마치기':'건너뛰기'}</button></div></div></div>`;
    const A=app();const chat=A.querySelector('[data-chat]');const say=async()=>{const inp=A.querySelector('[data-line]');const s=inp.value.trim();if(!s)return;inp.value='';const fx=A.querySelector('[data-flex]').value;const wag=A.querySelector('[data-wag]').checked&&fx;
      chat.insertAdjacentHTML('beforeend',`<div class="msg me">${esc2(P.name)}: ${esc2(s)}${fx?` <small>(${esc2(P.assets.find(a=>a.id===fx).n)} 과시)</small>`:''}</div><div class="msg th">…</div>`);chat.scrollTop=1e9;
      const r=await aiPress(CC,nx,turns,s+(wag?' (내 자산을 걸고 내기하자고 제안함)':''),fx);chat.querySelector('.th').remove();turns.push({me:1,s},{me:0,s:r.reply});
      nx.hype+=+r.hype||0;nx.bad+=+r.bad||0;nx.oppMot=(nx.oppMot||0)+(+r.oppMotivation||0);P.fame=clamp(P.fame+(+r.respect||0)*.3,0,100);
      chat.insertAdjacentHTML('beforeend',`<div class="msg op">${flag(o.nat)} ${dn(o)}: ${esc2(r.reply)}</div><div class="msg sys">📣 ${esc2(r.crowd||'')} <b>${(+r.hype||0)>=0?'+':''}${+r.hype||0} 흥행</b></div>${r.headline?`<div class="msg news">📰 ${esc2(r.headline)}</div>`:''}`);
      if(wag&&r.wager&&r.wager.accept){const mine=P.assets.find(a=>a.id===fx);const it=ITEMS(GG.y).filter(x=>x.c==='watch'||x.c==='car').sort((a,b)=>Math.abs(a.price-(r.wager.value||mine.bp))-Math.abs(b.price-(r.wager.value||mine.bp)))[0];
        nx.wager={myId:fx,oppItem:Object.assign({},it,{n:r.wager.oppItem||it.n,price:r.wager.value||it.price})};chat.insertAdjacentHTML('beforeend',`<div class="msg news">🎲 내기 성사! 내 ${esc2(mine.n)} vs 상대의 ${esc2(nx.wager.oppItem.n)} ($${fmtM(nx.wager.oppItem.price)})</div>`);nx.hype+=8}
      else if(wag&&r.wager)chat.insertAdjacentHTML('beforeend',`<div class="msg sys">상대가 내기를 거절했습니다.</div>`);
      chat.scrollTop=1e9;A.querySelector('[data-skip]').textContent=turns.length>=6?'기자회견 마치기 ▶':'기자회견 마치기';if(turns.length>=6)A.querySelector('[data-say]').disabled=true};
    A.querySelector('[data-say]').onclick=say;A.querySelector('[data-line]').onkeydown=e=>{if(e.key==='Enter')say()};A.querySelector('[data-skip]').onclick=()=>{P.hype=clamp(P.hype+nx.hype,0,100);step2()}};
  const step2=()=>{const hyd=(nx.rules?RULESETS[nx.rules]:orgRules(nx.org,GG.y)).hydration;const wcut=P.A.weightCut;const risk=Math.round(clamp((14-wcut)*3+(WC[P.wc].lb<150?4:0),2,40));
    app().innerHTML=`<div class="page fw"><div class="fwh"><span class="H">WEIGH-IN</span><b>계체량</b><em>${WC[P.wc].n} ${WC[P.wc].lb}lb</em></div><div class="card"><p>${hyd?'💧 수분 검사 단체: 극한 감량이 불가능합니다.':'감량 전략을 고르세요.'}</p>
     <button class="bgc" data-c="safe"><b>안전 감량</b><span>체력 손실 거의 없음. 체격 이점 없음.</span></button>${hyd?'':`<button class="bgc" data-c="hard"><b>극한 감량</b><span>근력↑ (리하이드레이션 체격 이점), 맷집·지구력↓. 계체 실패 위험 ${risk}%</span></button>`}</div></div>`;
    app().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let c=b.dataset.c;if(c==='hard'&&Math.random()*100<risk){c='miss';nx.missed=1;CC.addFeed('⚖️ 계체 실패! 대전료 20% 몰수',1);toast('⚖️ 계체 실패 — 대전료 20% 몰수')}nx.cut=c;step3()})};
  const step3=()=>{app().innerHTML=`<div class="page fw"><div class="fwh"><span class="H">FIGHT NIGHT</span><b>${nx.ev}</b><em>${nx.title?'👑 타이틀전':''}</em></div><div class="card center"><div class="nfv"><div><b>${esc2(P.name)}</b><small>${P.rec.w}-${P.rec.l}</small></div><i class="H">VS</i><div><b>${flag(o.nat)} ${dn(o)}</b><small>${o.rec.w}-${o.rec.l} ${rStars(o.r)}</small></div></div>
     <p class="sm mu">${rulesTxt(nx.rules?RULESETS[nx.rules]:orgRules(nx.org,GG.y,nx.title||nx.main))} · 흥행 ${Math.round(P.hype)} ${nx.wager?'· 🎲 자산 내기 걸림':''}</p>
     <button class="btn big" data-play>🥊 직접 싸우기</button><button class="btn big ghost" data-sim>⚡ 시뮬레이션</button></div></div>`;
    const A=app();A.querySelector('[data-play]').onclick=()=>{const cfg=CC.fightCfg(nx,nx.cut);const root=document.createElement('div');document.body.appendChild(root);new Match(root,cfg,res=>{root.remove();post(res)})};
    A.querySelector('[data-sim]').onclick=()=>{const cfg=CC.fightCfg(nx,nx.cut);const r=simFight({A:cfg.red.A},{A:Object.assign({},cfg.blue.A,nx.oppMot>6?{heart:20}:{})},cfg.rules);post({winner:r.w,method:r.method,detail:r.detail,round:r.round,time:r.time,stats:null,sim:1})}};
  const post=async res=>{const out=CC.resolve(nx,res);save();const won=res.winner===0;
    app().innerHTML=`<div class="page fw"><div class="fwh ${won?'win':'loss'}"><span class="H">${won?'VICTORY':res.winner<0?'DRAW':'DEFEAT'}</span><b>${res.method} ${res.detail||''}</b><em>${res.round}R ${fmtT(res.time||0)}</em></div>
     <div class="card"><p>💵 수입 $${fmtM(out.pay)}${out.bonus?` (보너스 $${fmtM(out.bonus)} 포함)`:''}${out.ppv?` · PPV $${fmtM(out.ppv)}`:''}${out.belt?'<br>👑 새 챔피언!':''}${out.wag?`<br>🎲 내기: ${esc2(out.wag)}`:''}</p></div>
     <div class="card press"><h3>🎙️ 케이지 인터뷰</h3><div class="chat" data-chat><div class="msg sys">…</div></div><div class="row"><input class="inp" data-ans placeholder="답변 (콜아웃하려면 선수 이름을)" maxlength="160"><button class="btn" data-ok>답변</button></div><button class="btn ghost sm" data-done>넘어가기</button></div></div>`;
    const A=app(),chat=A.querySelector('[data-chat]');const q=await aiInterviewQ(CC,nx,res);chat.innerHTML=`<div class="msg sys">🎤 ${esc2(q)}</div>`;
    const done=()=>{hub();if(out.belt)toast('👑 챔피언 등극!')};A.querySelector('[data-done]').onclick=done;
    A.querySelector('[data-ok]').onclick=async()=>{const ans=A.querySelector('[data-ans]').value.trim();if(!ans)return;A.querySelector('[data-ok]').disabled=true;chat.insertAdjacentHTML('beforeend',`<div class="msg me">${esc2(P.name)}: ${esc2(ans)}</div><div class="msg th">…</div>`);
      const j=await aiInterviewJudge(CC,nx,res,q,ans);chat.querySelector('.th').remove();P.fame=clamp(P.fame+(+j.fame||0),0,100);P.hype=clamp(P.hype+(+j.hype||0),0,100);
      let co='';if(j.callout){const f=findCallout(CC,j.callout)||findCallout(CC,ans);if(f){P.rivals[f.id]=(P.rivals[f.id]||0)+3;if(f.org===P.org&&f.wc===P.wc&&P.contract&&Math.random()<.5+P.fame/200){const of=CC.fightOffer(P.org);if(of){of.opp=f.id;of.title=GG.T[P.org][P.wc].ch===f.id;P.offers.push(of);co=`<div class="msg news">📩 단체가 ${dn(f)}전을 제안했습니다!</div>`}}}}
      chat.insertAdjacentHTML('beforeend',`<div class="msg sys">📣 ${esc2(j.crowd||'')}</div><div class="msg news">📰 ${esc2(j.headline||'')}</div>${j.promoter?`<div class="msg op">대표: ${esc2(j.promoter)}</div>`:''}${co}`);CC.addFeed(`🎙️ "${esc2(ans.slice(0,50))}"`,1);save();A.querySelector('[data-done]').textContent='허브로 ▶'}};
  const step0=()=>{if(nx.camp){step1();return}const sr=scoutReport(o);const me=grpOvr(P.A);let foc='counter',int='normal';
    const opts=[['counter',`🧠 맞춤 전략`,`상대 최고 무기(${sr.best})를 봉쇄: ${Object.keys(COUNTER[sr.best]).map(k=>ANAME[k]).join('·')}`],...Object.entries(CAMPS).map(([k,v])=>[k,v[0],v[1]])];
    const draw=()=>{app().innerHTML=`<div class="page fw"><div class="fwh"><span class="H">FIGHT CAMP</span><b>훈련 캠프</b><em>${esc2(P.name)} vs ${dn(o)} · ${nx.ev}</em></div>
     <div class="card"><h3>🔍 상대 분석 — ${flag(o.nat)} ${dn(o)}</h3>${ovrBar(o.A)}<div class="scout"><div><b class="pos">강점</b><ul>${sr.str.map(k=>`<li>${ANAME[k]} <b class="${aCls(o.A[k])}">${Math.round(o.A[k])}</b></li>`).join('')}</ul></div><div><b class="neg">약점</b><ul>${sr.weak.map(k=>`<li>${ANAME[k]} <b class="${aCls(o.A[k])}">${Math.round(o.A[k])}</b></li>`).join('')}</ul></div></div>
      <p class="sm mu">내 종합 <b>${me.tot}</b> vs 상대 <b>${sr.tot}</b> · 상대는 <b>${sr.best}</b>이(가) 가장 강하고 <b>${sr.worst}</b>이(가) 가장 약해요.</p></div>
     <div class="card"><h3>🏕️ 캠프 방향</h3><div class="campo">${opts.map(([k,n,d])=>`<button class="bgc ${foc===k?'on':''}" data-f="${k}"><b>${n}</b><span>${d}</span></button>`).join('')}</div>
      <label>강도</label><div class="row wrap">${Object.entries(CAMP_INT).map(([k,v])=>`<button class="chip ${int===k?'on':''}" data-i="${k}">${v[0]} <small>$${fmtM(campCost(P,k))}</small></button>`).join('')}</div>
      <p class="sm mu">${CAMP_INT[int][2]}${int==='hard'?` · 현재 피로도 ${Math.round(P.fat||0)} → 부상 위험 <b class="neg">${campHurtRisk(P)}%</b>`:''}. 캠프 효과는 이번 경기에만 적용돼요.</p>
      <button class="btn full" data-go ${P.money<campCost(P,int)?'disabled':''}>캠프 시작 ▶</button>${P.money<campCost(P,int)?'<p class="sm neg">캠프 비용이 부족해요.</p>':''}</div></div>`;
      const A=app();A.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{foc=b.dataset.f;draw()});A.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{int=b.dataset.i;draw()});
      A.querySelector('[data-go]').onclick=()=>{const c=runCamp(P,o,foc,int);nx.camp=c;save();const txt=Object.entries(c.mods).filter(([,v])=>v).map(([k,v])=>`${ANAME[k]} ${v>0?'+':''}${v}`).join(' · ');
        CC.addFeed(`🏕️ ${c.label} (${CAMP_INT[int][0]}) 완료${c.inj?' · 스파링 중 부상':''}`,1);
        A.innerHTML=`<div class="page fw"><div class="fwh ${c.inj?'loss':'win'}"><span class="H" style="font-size:22px">${c.inj?'CAMP INJURY':'CAMP COMPLETE'}</span><b>${c.label}</b><em>${CAMP_INT[int][0]} · 비용 $${fmtM(c.cost)}</em></div><div class="card"><p>${c.inj?'🚑 스파링 중 부상을 입었어요. 효과가 절반으로 줄고 체력·맷집이 떨어진 채로 싸웁니다.<br>':''}이번 경기 보정: <b>${txt}</b></p><button class="btn full" data-n>기자회견으로 ▶</button></div></div>`;
        A.querySelector('[data-n]').onclick=step1}};draw()};
  step0()}
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',()=>titleScreen());else titleScreen();
</script>
